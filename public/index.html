<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FileShare</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://bohdan.lol/glitch.css">
    <link rel="stylesheet" href="/public/style.css" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom sticky-top blur-bg">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
            <i class="bi bi-cloud-arrow-up-fill"></i>
            <span class="glitch layers" data-text="FileShare"><span>FileShare</span></span>
        </a>
    </div>
</nav>

<main class="container py-4">
    <div class="row g-4">
        <!-- LEFT: Upload -->
        <div class="col-12 col-lg-4 sticky-col" id="leftCol">
        <div class="card shadow-lg h-100 lift">
                <div class="card-body">
                    <h5 class="card-title mb-3">Upload a file</h5>
                    <div class="mb-2">
                        <div id="turnstile-container"
                             class="cf-turnstile"
                             data-sitekey="PASTE_YOUR_SITE_KEY"
                             data-theme="dark">
                        </div>
                    </div>
                    <div id="dropArea" class="drop-area drop-fixed mb-3" role="button" tabindex="0" aria-label="Drag & drop or click to upload">
                        <div class="text-center">
                            <i class="bi bi-cloud-upload display-6 d-block mb-2"></i>
                            <div class="fw-medium">Drag & drop here or click to browse</div>
                            <div class="text-secondary small">Images, video, archives, PDF, text, etc.</div>
                        </div>
                        <input type="file" id="fileInput" name="files" class="visually-hidden" multiple />
                    </div>

                    <div id="preUploadRow" class="d-flex align-items-center gap-2 mb-3 d-none">
                        <button id="togglePwd" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-shield-lock me-1"></i> Add delete password
                        </button>
                        <span class="text-secondary small">Optional. Without it, anyone can delete the file.</span>
                    </div>

                    <div id="pwdRow" class="mb-3 d-none">
                        <label for="deletePassword" class="form-label">Delete password</label>
                        <div class="input-group">
                            <input type="password" id="deletePassword" class="form-control" placeholder="Create a password">
                            <button class="btn btn-outline-secondary" type="button" id="togglePwdVisibility" aria-label="Toggle password visibility">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div id="progressRow" class="mb-3 d-none">
                        <label class="form-label mb-1">Upload</label>
                        <div class="progress" role="progressbar" aria-label="Uploading">
                            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0">0%</div>
                        </div>
                    </div>

                    <div id="uploadsList" class="uploads-list mb-3 d-none"></div>

                    <div class="d-grid">
                        <button id="uploadBtn" class="btn btn-primary btn-lg d-none">
                            <i class="bi bi-arrow-up-circle me-2"></i>Upload
                        </button>
                        <div id="status" class="mt-2 small"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT: Files -->
        <div class="col-12 col-lg-8" id="filesCol">
            <div class="card shadow-lg h-100 lift">
                <div class="card-body">
                    <div id="filesHeader" class="d-flex flex-column flex-md-row gap-2 align-items-stretch align-items-md-center justify-content-between">
                        <h5 class="card-title m-0 d-flex align-items-center gap-2">
                            Files <span id="filesCount" class="badge rounded-pill text-bg-secondary">0</span>
                        </h5>
                    </div>
                    <div id="filesGrid" class="files-grid mt-3"></div>
                    <div id="emptyState" class="text-center text-secondary py-5 d-none">
                        <i class="bi bi-inbox display-6 d-block mb-2"></i>
                        <div>No files yet</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Floating Upload Button (mobile) -->
<button id="fabUpload" class="fab d-lg-none" title="Upload">
    <i class="bi bi-plus-lg"></i>
</button>

<!-- Delete Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-trash3 me-2"></i>Delete file</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2"><span class="fw-medium">File:</span> <span id="delFileName"></span></div>
                <label for="delPassword" class="form-label">Password (if the file is protected)</label>
                <input type="password" class="form-control" id="delPassword" placeholder="Enter delete password">
                <div id="delError" class="text-danger small mt-2 d-none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteBtn"><i class="bi bi-trash3 me-1"></i>Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Toasts -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastBody">Done</div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/main.js" type="module"></script>
</body>
</html>
